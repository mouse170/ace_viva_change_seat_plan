<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景深邃午夜海軍藍漸層 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14132B" />
      <stop offset="45%" stop-color="#1E1D3F" />
      <stop offset="100%" stop-color="#282654" />
    </linearGradient>

    <!-- 邊框微光漸層 -->
    <linearGradient id="borderGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ADAD0" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#5ECBC0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4FA87D" stop-opacity="0.75" />
    </linearGradient>

    <!-- 中央聚光燈放射霧光 -->
    <radialGradient id="centerSpot" cx="256" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ECBC0" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#5BAE84" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1E1D3F" stop-opacity="0" />
    </radialGradient>

    <!-- 看台椅背薄荷綠立體漸層 -->
    <linearGradient id="seatBackGrad" x1="256" y1="130" x2="256" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8CEAE0" />
      <stop offset="35%" stop-color="#5ECBC0" />
      <stop offset="100%" stop-color="#3A8E72" />
    </linearGradient>

    <!-- 坐墊立體漸層 -->
    <linearGradient id="cushionGrad" x1="256" y1="285" x2="256" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ED6CB" />
      <stop offset="50%" stop-color="#4FA895" />
      <stop offset="100%" stop-color="#2C6B57" />
    </linearGradient>

    <!-- 換位環抱軌道漸層（上半弧） -->
    <linearGradient id="swapOrbitTop" x1="100" y1="360" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ECBC0" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#7ADAD0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 換位環抱軌道漸層（下半弧） -->
    <linearGradient id="swapOrbitBottom" x1="420" y1="180" x2="100" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FA87D" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5ECBC0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7ADAD0" />
    </linearGradient>

    <!-- 冠軍星芒金光漸層 -->
    <linearGradient id="starGrad" x1="256" y1="62" x2="256" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E0D1F" flood-opacity="0.6" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 外層 Squircle 底座 -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bgGrad)" />
  <rect x="22" y="22" width="468" height="468" rx="112" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- 2. 中央聚光燈氛圍 -->
  <circle cx="256" cy="245" r="215" fill="url(#centerSpot)" />

  <!-- 3. 動態換位軌道流轉光弧（循環換位符號） -->
  <g opacity="0.95">
    <!-- 上半循環軌道（由左下向右上環抱） -->
    <path
      d="M108 340C88 280 102 195 156 142C208 92 288 80 354 112C376 123 397 139 414 158"
      stroke="url(#swapOrbitTop)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-dasharray="240 18"
    />
    <!-- 上軌道箭頭端點（指向右前方席位） -->
    <path
      d="M428 174L424 136L392 158Z"
      fill="#FFFFFF"
    />

    <!-- 下半循環軌道（由右上向左下環抱） -->
    <path
      d="M404 182C424 242 410 327 356 380C304 430 224 442 158 410C136 399 115 383 98 364"
      stroke="url(#swapOrbitBottom)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-dasharray="240 18"
    />
    <!-- 下軌道箭頭端點（指向左後方席位） -->
    <path
      d="M84 348L88 386L120 364Z"
      fill="#7ADAD0"
    />

    <!-- 軌道上的換位席位節點（A、B、C 席位光球） -->
    <circle cx="132" cy="162" r="11" fill="#212047" stroke="#7ADAD0" stroke-width="5" />
    <circle cx="380" cy="360" r="11" fill="#212047" stroke="#5ECBC0" stroke-width="5" />
  </g>

  <!-- 4. 核心主角：看台 VIP 席位座椅（高質感幾何結構） -->
  <g filter="url(#shadowFilter)">
    <!-- (A) 金屬雙管支架（底座） -->
    <path d="M216 345L200 422H312L296 345" stroke="#16152F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M216 345L200 422H312L296 345" stroke="#4B4975" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 圓弧底盤地腳 -->
    <rect x="180" y="416" width="152" height="18" rx="9" fill="#181736" stroke="#5ECBC0" stroke-width="3" />

    <!-- (B) 厚實座墊（Seat Cushion）微俯視立體角 -->
    <!-- 坐墊底層陰影板 -->
    <rect x="144" y="306" width="224" height="48" rx="20" fill="#1C4B3D" />
    <!-- 坐墊主體 -->
    <rect x="144" y="286" width="224" height="54" rx="22" fill="url(#cushionGrad)" stroke="#8CEAE0" stroke-width="4" />
    <!-- 坐墊中央立體反光弧 -->
    <path d="M174 300C220 306 292 306 338 300" stroke="#A7F3EB" stroke-width="4" stroke-linecap="round" opacity="0.75" />

    <!-- (C) 弧形人體工學椅背（Seat Back） -->
    <!-- 椅背邊界陰影襯底 -->
    <rect x="168" y="142" width="176" height="144" rx="36" fill="#16392E" />
    <!-- 椅背主體 -->
    <rect x="168" y="134" width="176" height="144" rx="36" fill="url(#seatBackGrad)" stroke="#A7F3EB" stroke-width="5" />

    <!-- 椅背中央 ACE 幾何動感縫線（雙重 V 符號：Viva & 排球流線） -->
    <path d="M208 174L256 226L304 174" stroke="#255C4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    <path d="M216 204L256 244L296 204" stroke="#8CEAE0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- 5. 頂部焦點：王牌應援焦點 ACE 四角星芒（Viva Sparkle Star） -->
  <g filter="url(#starGlow)">
    <!-- 金色外圈氛圍光環 -->
    <circle cx="256" cy="98" r="42" fill="#F59E0B" fill-opacity="0.18" />

    <!-- 主星芒（四角尖星） -->
    <!-- 橫幅約 80px，縱幅約 90px -->
    <path
      d="M256 52
         C258 78 274 94 302 98
         C274 102 258 118 256 144
         C254 118 238 102 210 98
         C238 94 254 78 256 52Z"
      fill="url(#starGrad)"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- 星芒中心璀璨亮白核心 -->
    <circle cx="256" cy="98" r="7.5" fill="#FFFFFF" />

    <!-- 四周微芒小星辰（陪伴點綴） -->
    <circle cx="328" cy="84" r="4" fill="#FDE047" opacity="0.9" />
    <circle cx="184" cy="112" r="3.5" fill="#FDE047" opacity="0.8" />
  </g>
</svg>
